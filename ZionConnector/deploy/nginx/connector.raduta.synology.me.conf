server {
    listen 443 ssl;
    server_name connector.raduta.synology.me;

    # Configure the certificate in DSM Web Station / reverse proxy.
    root /volume1/www/connector.raduta.synology.me;
    index index.php;

    location ~ ^/(?:\.env|key(?:/|$)|var(?:/|$)|vendor(?:/|$)|composer\.(?:json|lock)|phpunit\.xml) {
        deny all;
    }

    # public/ is an internal implementation directory, not a public URL.
    location = /public/index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/public/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /public/ {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        rewrite ^ /public/index.php last;
    }
}
