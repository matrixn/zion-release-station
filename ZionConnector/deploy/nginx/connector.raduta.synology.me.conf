# Zion Connector Nginx rules for Synology Web Station.
#
# Add these rules to the Nginx custom rules for the Web Station portal. The
# portal itself must provide the HTTPS listener, certificate and PHP-FPM
# handler selected by the PHP profile. Do not add a hard-coded fastcgi_pass:
# Synology creates a Unix socket per PHP profile.
#
# Set the Web Station document root to:
# /volume1/www/connector.raduta.synology.me/public

location ~ ^/(?:\.env|key(?:/|$)|var(?:/|$)|vendor(?:/|$)|composer\.(?:json|lock)|phpunit\.xml) {
    deny all;
}

# The connector is a front-controller application. Without this rule Nginx
# returns its own 404/403 for /healthz and every /v1/* route.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
